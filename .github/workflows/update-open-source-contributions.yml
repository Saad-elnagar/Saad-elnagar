name: Update Open Source Contributions

on:
  schedule:
    # Check every six hours for newly merged external pull requests.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update contribution list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Saad-elnagar
        run: python .github/scripts/update_open_source_contributions.py

      - name: Commit updated profile if needed
        run: |
          if git diff --quiet -- README.md; then
            echo "No contribution changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh open source contributions"
          git push
